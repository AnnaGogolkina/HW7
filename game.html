<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переворот текста</title>
</head>
<body>
    
    <script>
        let inputText = prompt ('Введите текст');

const reversedText = inputText.split('').reverse().join('');
alert(reversedText);
    </script>
</body>
</html>
